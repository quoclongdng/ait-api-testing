openapi: 3.1.0
info:
  title: AIT Web JSON API
  version: 1.0.0
  description: |
    Hợp đồng JSON API nội bộ của ứng dụng Laravel. Hợp đồng ở trạng thái DRAFT
    cho đến Gate G0. Response thành công dùng `data`; response danh sách có thêm
    `meta`. Mọi lỗi dùng error envelope và `trace_id` theo docs/DESIGN.md §6.
servers:
  - url: http://localhost:8000/api/v1
    description: Môi trường phát triển cục bộ
tags:
  - { name: System, description: Trạng thái hệ thống }
  - { name: Projects, description: Project thuộc người dùng }
  - { name: API specs, description: Nhập và đọc đặc tả OpenAPI }
  - { name: Business rules, description: Ràng buộc nghiệp vụ của project }
  - { name: Test suites, description: Nhóm test case theo spec }
  - { name: Generation, description: "Job sinh test RULE, LLM và HYBRID" }
  - { name: Test cases, description: "DSL, duyệt và lưu trữ test case" }
  - { name: Test runs, description: Thực thi và báo cáo test }
  - { name: Experiments, description: Thực nghiệm benchmark }
  - { name: Administration, description: Tài nguyên chỉ ADMIN quản lý }
security:
  - cookieAuth: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Kiểm tra trạng thái web, cơ sở dữ liệu và ai-service
      security: []
      responses:
        "200":
          description: Hệ thống hoạt động; `degraded` nếu một dependency lỗi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: Liệt kê project người dùng được phép xem
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Danh sách project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Tạo project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectWrite" }
      responses:
        "201":
          description: Project đã được tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /projects/{projectId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Projects]
      operationId: getProject
      summary: Xem project
      responses:
        "200":
          description: Chi tiết project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Cập nhật project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPatch" }
      responses:
        "200":
          description: Project đã được cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Xóa mềm project
      responses:
        "204": { description: Project đã được xóa mềm }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /projects/{projectId}/specs:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [API specs]
      operationId: createApiSpec
      summary: Nhập OpenAPI bằng file hoặc nội dung JSON/YAML
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiSpecContentCreate" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ApiSpecFileCreate" }
      responses:
        "201":
          description: Spec đã được lưu và parse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSpecResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/SpecParseFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /specs/{specId}:
    parameters:
      - { $ref: "#/components/parameters/SpecId" }
    get:
      tags: [API specs]
      operationId: getApiSpec
      summary: Xem spec và trạng thái parse
      responses:
        "200":
          description: Chi tiết spec
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSpecResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /specs/{specId}/endpoints:
    parameters:
      - { $ref: "#/components/parameters/SpecId" }
    get:
      tags: [API specs]
      operationId: listApiSpecEndpoints
      summary: Liệt kê endpoint đã chuẩn hóa của spec
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Danh sách endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointCollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            `VALIDATION_FAILED` khi `page`/`per_page` nằm ngoài miền khai báo (không kẹp giá trị, giống mọi
            thao tác liệt kê khác), hoặc `SPEC_PARSE_FAILED` khi spec ở trạng thái `PARSE_FAILED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /projects/{projectId}/business-rules:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Business rules]
      operationId: listBusinessRules
      summary: Liệt kê business rule của project
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Danh sách business rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessRuleCollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Business rules]
      operationId: createBusinessRule
      summary: Tạo business rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessRuleWrite" }
      responses:
        "201":
          description: Business rule đã được tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessRuleResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /business-rules/{businessRuleId}:
    parameters:
      - { $ref: "#/components/parameters/BusinessRuleId" }
    get:
      tags: [Business rules]
      operationId: getBusinessRule
      summary: Xem business rule
      responses:
        "200":
          description: Chi tiết business rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessRuleResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Business rules]
      operationId: updateBusinessRule
      summary: Cập nhật business rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessRulePatch" }
      responses:
        "200":
          description: Business rule đã được cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessRuleResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Business rules]
      operationId: deleteBusinessRule
      summary: Xóa business rule
      responses:
        "204": { description: Business rule đã được xóa }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /projects/{projectId}/suites:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Test suites]
      operationId: listTestSuites
      summary: Liệt kê test suite của project
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Danh sách test suite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestSuiteCollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Test suites]
      operationId: createTestSuite
      summary: Tạo test suite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestSuiteCreate" }
      responses:
        "201":
          description: Test suite đã được tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestSuiteResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /suites/{suiteId}:
    parameters:
      - { $ref: "#/components/parameters/SuiteId" }
    get:
      tags: [Test suites]
      operationId: getTestSuite
      summary: Xem test suite
      responses:
        "200":
          description: Chi tiết test suite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestSuiteResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /suites/{suiteId}/generation-jobs:
    parameters:
      - { $ref: "#/components/parameters/SuiteId" }
    post:
      tags: [Generation]
      operationId: createGenerationJob
      summary: Tạo job sinh test theo RULE, LLM hoặc HYBRID
      description: |
        Khi ai-service báo `provider: disabled` trên `GET /health` (máy chủ không có LLM, ADR-0007),
        LLM và HYBRID bị từ chối với 422 `VALIDATION_FAILED` (`details.strategy`); RULE vẫn chạy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerationJobCreate" }
      responses:
        "202":
          description: Job đã vào hàng đợi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationJobResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AiServiceUnavailable" }

  /generation-jobs/{generationJobId}:
    parameters:
      - { $ref: "#/components/parameters/GenerationJobId" }
    get:
      tags: [Generation]
      operationId: getGenerationJob
      summary: Xem trạng thái và thống kê job sinh test
      responses:
        "200":
          description: Chi tiết generation job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationJobResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /suites/{suiteId}/test-cases:
    parameters:
      - { $ref: "#/components/parameters/SuiteId" }
    get:
      tags: [Test cases]
      operationId: listTestCases
      summary: Liệt kê test case trong suite
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: source
          in: query
          schema: { $ref: "#/components/schemas/TestCaseSource" }
        - name: technique
          in: query
          schema: { $ref: "#/components/schemas/TestTechnique" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TestCaseStatus" }
      responses:
        "200":
          description: Danh sách test case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCaseCollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /test-cases/{testCaseId}:
    parameters:
      - { $ref: "#/components/parameters/TestCaseId" }
    get:
      tags: [Test cases]
      operationId: getTestCase
      summary: Xem test case, DSL và lỗi validation
      responses:
        "200":
          description: Chi tiết test case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCaseResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Test cases]
      operationId: updateTestCaseDsl
      summary: Sửa DSL thủ công và validate lại
      description: |
        Máy trạng thái §4.2. DSL được validate lại (JSON Schema + ngữ nghĩa với spec của suite) và tính lại fingerprint để dedup; nguồn đổi thành MANUAL.
        - INVALID: DSL hợp lệ và không trùng → VALID; DSL vẫn lỗi → lưu bản nháp, giữ INVALID kèm `validation_errors` (200).
        - VALID / APPROVED: DSL hợp lệ và không trùng → VALID (case APPROVED phải duyệt lại); DSL lỗi → 422 DSL_INVALID, không lưu.
        - DSL trùng fingerprint với case khác trong suite → 409 CONFLICT, không lưu.
        - DUPLICATE / ARCHIVED → 409 INVALID_STATE_TRANSITION.
        - Thiếu `dsl` hoặc `title` rỗng → 422 VALIDATION_FAILED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestCasePatch" }
      responses:
        "200":
          description: Test case đã được cập nhật và validate lại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCaseResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "INVALID_STATE_TRANSITION (case DUPLICATE/ARCHIVED) hoặc CONFLICT (DSL trùng case khác trong suite)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/DslInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }

  /test-cases/{testCaseId}/approve:
    parameters:
      - { $ref: "#/components/parameters/TestCaseId" }
    post:
      tags: [Test cases]
      operationId: approveTestCase
      summary: Duyệt test case VALID
      description: VALID → APPROVED. Trạng thái khác → 409 INVALID_STATE_TRANSITION.
      responses:
        "200":
          description: Test case đã được duyệt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCaseResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStateTransition" }
        "500": { $ref: "#/components/responses/InternalError" }

  /test-cases/{testCaseId}/archive:
    parameters:
      - { $ref: "#/components/parameters/TestCaseId" }
    post:
      tags: [Test cases]
      operationId: archiveTestCase
      summary: Lưu trữ test case VALID hoặc APPROVED
      description: VALID | APPROVED → ARCHIVED. Trạng thái khác → 409 INVALID_STATE_TRANSITION.
      responses:
        "200":
          description: Test case đã được lưu trữ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCaseResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStateTransition" }
        "500": { $ref: "#/components/responses/InternalError" }

  /suites/{suiteId}/runs:
    parameters:
      - { $ref: "#/components/parameters/SuiteId" }
    post:
      tags: [Test runs]
      operationId: createTestRun
      summary: Tạo lần chạy test suite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestRunCreate" }
      responses:
        "202":
          description: Test run đã vào hàng đợi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRunResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/TargetNotAllowed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /runs/{runId}:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [Test runs]
      operationId: getTestRun
      summary: Xem trạng thái và tổng kết test run
      responses:
        "200":
          description: Chi tiết test run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRunResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /runs/{runId}/results:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [Test runs]
      operationId: listTestRunResults
      summary: Liệt kê kết quả từng test case
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: verdict
          in: query
          schema: { $ref: "#/components/schemas/TestVerdict" }
      responses:
        "200":
          description: Danh sách test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestResultCollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /runs/{runId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    post:
      tags: [Test runs]
      operationId: cancelTestRun
      summary: Hủy test run đang QUEUED hoặc RUNNING
      responses:
        "200":
          description: Test run đã được hủy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRunResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStateTransition" }
        "500": { $ref: "#/components/responses/InternalError" }

  /runs/{runId}/export:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [Test runs]
      operationId: exportTestRun
      summary: Xuất báo cáo test run
      description: |
        Trả file tải về (`Content-Disposition: attachment`). JSON theo `TestRunReport`;
        CSV là UTF-8 có BOM, ô bắt đầu bằng `= + - @ \t \r` được thêm tiền tố `'` (chống CSV injection);
        HTML tự chứa (không script, không tài nguyên ngoài), mọi dữ liệu từ target/LLM đều được escape.
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [json, csv, html] }
      responses:
        "200":
          description: Báo cáo ở định dạng yêu cầu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRunReport" }
            text/csv:
              schema: { type: string }
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /experiments:
    get:
      tags: [Experiments]
      operationId: listExperiments
      summary: Liệt kê thực nghiệm
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Danh sách thực nghiệm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentCollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Experiments]
      operationId: createExperiment
      summary: Tạo thực nghiệm
      description: |
        Tạo thực nghiệm ở trạng thái PLANNED và đưa vào hàng đợi (D10). Worker chạy, với mỗi lần lặp r
        (seed = config.seeds[r-1], mặc định giao thức 42, 1024, 2026 — ADR-0003): sinh suite mới theo chiến lược,
        reset sandbox (`POST /__admin/reset`) rồi chạy toàn bộ suite trên biến thể sạch và trên từng biến thể
        chỉ bật một bug, áp dụng D14 rồi tính chỉ số §11 (trung bình và độ lệch chuẩn). Mỗi bước là một job
        riêng trong hàng đợi.
        Trả 422 khi benchmark chưa có seeded bug, thiếu openapi.yaml hoặc sandbox biến thể bug chưa cấu hình.
        Bản triển khai không có sandbox biến thể bug (`EXPERIMENTS_ENABLED=false`, ADR-0007) luôn trả 422
        `VALIDATION_FAILED` (`details.experiments`); chiến lược LLM/HYBRID trả 422 khi ai-service báo
        `provider: disabled`. Đọc và xuất thực nghiệm đã có vẫn hoạt động.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExperimentCreate" }
      responses:
        "202":
          description: Thực nghiệm đã được lập kế hoạch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /experiments/{experimentId}:
    parameters:
      - { $ref: "#/components/parameters/ExperimentId" }
    get:
      tags: [Experiments]
      operationId: getExperiment
      summary: Xem cấu hình, trạng thái và chỉ số thực nghiệm
      responses:
        "200":
          description: Chi tiết thực nghiệm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /experiments/{experimentId}/export:
    parameters:
      - { $ref: "#/components/parameters/ExperimentId" }
    get:
      tags: [Experiments]
      operationId: exportExperiment
      summary: Xuất dữ liệu thô và chỉ số của thực nghiệm
      description: |
        Trả file tải về (`Content-Disposition: attachment`) gồm cấu hình (model, temperature, seed từng lần lặp),
        dữ liệu từng lần lặp, phát hiện từng bug (D14) và chỉ số §11 (ADR-0003). JSON theo `ExperimentExport`;
        CSV là bảng dạng dài UTF-8 có BOM với cột
        `experiment_id, experiment_name, benchmark, benchmark_version, strategy, status, model, temperature, repetitions,
        record_type, repetition, seed, bug_code, bug_category, key, value`, trong đó `record_type` là
        `metric | stddev | repetition | detection | error`; ô bắt đầu bằng `= + - @ \t \r` được thêm tiền tố `'`.
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Dữ liệu thực nghiệm ở định dạng yêu cầu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentExport" }
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/users:
    get:
      tags: [Administration]
      operationId: listUsers
      summary: Liệt kê người dùng
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Danh sách người dùng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Administration]
      operationId: createUser
      summary: Tạo tài khoản người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Người dùng đã được tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/users/{userId}:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    patch:
      tags: [Administration]
      operationId: updateUser
      summary: Đổi tên, vai trò hoặc trạng thái khóa của người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPatch" }
      responses:
        "200":
          description: Người dùng đã được cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/allowed-targets:
    get:
      tags: [Administration]
      operationId: listAllowedTargets
      summary: Liệt kê target được phép gọi
      responses:
        "200":
          description: Danh sách allowed target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedTargetCollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Administration]
      operationId: createAllowedTarget
      summary: Thêm target vào allowlist
      description: |
        `host` là hostname hoặc địa chỉ IP. Địa chỉ IPv4 phải viết dạng chuẩn a.b.c.d: host có nhãn cuối là số
        (2130706433, 0x7f000001, 127.1...) bị từ chối 422 `VALIDATION_FAILED`, hoặc `TARGET_NOT_ALLOWED` nếu địa chỉ
        thật thuộc vùng bị chặn. Địa chỉ link-local/metadata luôn bị chặn; khi chặn mạng riêng (máy chủ công khai),
        loopback, mạng riêng và tên nội bộ (localhost, host.docker.internal, metadata.google.internal...) cũng bị chặn.
        Lỗi kiểm tra dữ liệu (`VALIDATION_FAILED`) có `details.<trường>` là danh sách thông báo; `TARGET_NOT_ALLOWED`
        (422) và `CONFLICT` (409) là lỗi nghiệp vụ nên `details` là đối tượng ngữ cảnh: `host` (chuỗi, đã chuẩn hóa),
        và `port` với `CONFLICT`; thông báo cho người dùng nằm ở `error.message`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowedTargetWrite" }
      responses:
        "201":
          description: Allowed target đã được tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedTargetResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/allowed-targets/{allowedTargetId}:
    parameters:
      - { $ref: "#/components/parameters/AllowedTargetId" }
    delete:
      tags: [Administration]
      operationId: deleteAllowedTarget
      summary: Xóa target khỏi allowlist
      responses:
        "204": { description: Allowed target đã được xóa }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/benchmarks:
    get:
      tags: [Administration]
      operationId: listBenchmarks
      summary: Liệt kê benchmark
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Danh sách benchmark
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkCollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Administration]
      operationId: createBenchmark
      summary: Đăng ký benchmark
      description: |
        `version` được chuẩn hóa trước khi kiểm tra trùng và lưu: bỏ khoảng trắng đầu/cuối; phiên bản dạng số
        (sau tiền tố `v`/`V` tùy chọn là chữ số) có đúng một tiền tố `v` ("1.0", "V1.0" → "v1.0"), chuỗi khác giữ
        nguyên ("beta"); trùng (slug, version) sau chuẩn hóa trả 409 `CONFLICT`.
        Nếu tồn tại benchmark/<slug>/ground-truth.yaml thì các seeded bug được gắn vào benchmark mới, và `version`
        phải bằng phiên bản của ground truth (khác thì 422 `VALIDATION_FAILED` trên `version`; phiên bản mới
        được tạo bằng cách sửa ground-truth.yaml rồi đồng bộ ở M14).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BenchmarkCreate" }
      responses:
        "201":
          description: Benchmark đã được tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/benchmarks/{benchmarkId}:
    parameters:
      - { $ref: "#/components/parameters/BenchmarkId" }
    delete:
      tags: [Administration]
      operationId: deleteBenchmark
      summary: Xóa benchmark chưa được thực nghiệm nào dùng
      description: |
        Xóa benchmark cùng các seeded bug của nó (ví dụ bản đăng ký trùng do nhầm). Benchmark đã có thực nghiệm
        tham chiếu thì không xóa được: 409 `CONFLICT`, `details` gồm `benchmark_id` và `experiments` (số thực nghiệm).
      responses:
        "204": { description: Benchmark đã được xóa }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ait_session
  parameters:
    Page:
      name: page
      in: query
      description: Trang bắt đầu từ 1
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: Số phần tử trên một trang
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    SpecId: { name: specId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    BusinessRuleId: { name: businessRuleId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    SuiteId: { name: suiteId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    GenerationJobId: { name: generationJobId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    TestCaseId: { name: testCaseId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    RunId: { name: runId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    ExperimentId: { name: experimentId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    UserId: { name: userId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    AllowedTargetId: { name: allowedTargetId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    BenchmarkId: { name: benchmarkId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  responses:
    Unauthenticated: { description: Chưa đăng nhập, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: "Không có quyền với tài nguyên. Trên route /admin/*, TESTER luôn nhận 403 kể cả khi id không tồn tại (vai trò được kiểm tra trước khi tìm tài nguyên).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Không tìm thấy tài nguyên, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: Dữ liệu trùng hoặc xung đột, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    InvalidStateTransition: { description: Chuyển trạng thái không hợp lệ, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ValidationFailed: { description: Dữ liệu đầu vào không hợp lệ, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    SpecParseFailed: { description: OpenAPI không hợp lệ hoặc không hỗ trợ, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    DslInvalid: { description: DSL không qua schema hoặc kiểm tra ngữ nghĩa, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    TargetNotAllowed: { description: Target ngoài allowlist hoặc request không hợp lệ, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited:
      description: Quá giới hạn request
      headers:
        Retry-After: { description: Số giây nên chờ, schema: { type: integer, minimum: 1 } }
        X-RateLimit-Limit: { description: Số request tối đa trong một cửa sổ, schema: { type: integer, minimum: 1 } }
        X-RateLimit-Remaining: { description: Số request còn lại trong cửa sổ hiện tại, schema: { type: integer, minimum: 0 } }
        X-RateLimit-Reset: { description: Thời điểm (Unix timestamp) có thể gửi lại, schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AiServiceUnavailable: { description: Không gọi được ai-service, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    InternalError: { description: Lỗi nội bộ, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    ErrorCode:
      type: string
      enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, INVALID_STATE_TRANSITION, SPEC_PARSE_FAILED, DSL_INVALID, TARGET_NOT_ALLOWED, RATE_LIMITED, LLM_PROVIDER_ERROR, AI_SERVICE_UNAVAILABLE, INTERNAL_ERROR]
    Error:
      type: object
      additionalProperties: false
      required: [error, trace_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        trace_id: { type: string, minLength: 1 }
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [current_page, per_page, total]
      properties:
        current_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    JsonObject: { type: object, additionalProperties: true }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, checks]
          properties:
            status: { type: string, enum: [ok, degraded] }
            checks:
              type: object
              additionalProperties: false
              required: [database, ai_service]
              properties:
                database: { type: boolean }
                ai_service:
                  type: object
                  additionalProperties: false
                  required: [reachable, provider, version]
                  properties:
                    reachable: { type: boolean }
                    provider: { type: [string, "null"] }
                    version: { type: [string, "null"] }

    Project:
      type: object
      additionalProperties: false
      required: [id, name, description, owner_id, default_target_url, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 2000 }
        owner_id: { type: integer, format: int64, minimum: 1 }
        default_target_url: { type: [string, "null"], format: uri, maxLength: 500 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 2000 }
        default_target_url: { type: [string, "null"], format: uri, maxLength: 500 }
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 2000 }
        default_target_url: { type: [string, "null"], format: uri, maxLength: 500 }
    ProjectResponse: { type: object, additionalProperties: false, required: [data], properties: { data: { $ref: "#/components/schemas/Project" } } }
    ProjectCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Project" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    ApiSpecStatus: { type: string, enum: [UPLOADED, PARSED, PARSE_FAILED] }
    ApiSpec:
      type: object
      additionalProperties: false
      required: [id, project_id, version_label, source_filename, format, openapi_version, checksum, status, parse_errors, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        project_id: { type: integer, format: int64, minimum: 1 }
        version_label: { type: string, minLength: 1, maxLength: 50 }
        source_filename: { type: string, minLength: 1, maxLength: 255 }
        format: { type: string, enum: [json, yaml] }
        openapi_version: { type: string, minLength: 1, maxLength: 20 }
        checksum: { type: string, pattern: "^[a-f0-9]{64}$" }
        status: { $ref: "#/components/schemas/ApiSpecStatus" }
        parse_errors: { type: [array, "null"], items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApiSpecContentCreate:
      type: object
      additionalProperties: false
      required: [version_label, format, raw_content]
      properties:
        version_label: { type: string, minLength: 1, maxLength: 50 }
        source_filename: { type: [string, "null"], maxLength: 255 }
        format: { type: string, enum: [json, yaml] }
        raw_content: { type: string, minLength: 1, maxLength: 5242880 }
    ApiSpecFileCreate:
      type: object
      additionalProperties: false
