; Spec uploads up to 5 MB (docs/DESIGN.md §9, UploadSpecRequest/CreateApiSpecRequest max:5120).
; PHP defaults (upload_max_filesize=2M) silently dropped 2-5 MB files (S10-01 audit r2).
; 6M leaves headroom above the 5 MB rule; post_max_size also covers the other form fields.
upload_max_filesize = 6M
post_max_size = 8M
