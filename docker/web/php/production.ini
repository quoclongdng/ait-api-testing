; Production PHP settings for docker/web/Dockerfile.prod (on top of php.ini-production).
; php -S is the CLI SAPI, so OPcache must be enabled for the CLI explicitly.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code is baked into the image and never changes inside a running container.
opcache.validate_timestamps = 0
memory_limit = 256M
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
