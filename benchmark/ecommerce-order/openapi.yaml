openapi: 3.1.0
info:
  title: E-commerce Order Benchmark API
  version: 1.0.0
  description: >-
    Benchmark #2 clean sandbox for AI Testing Platform. It models multi-step cart,
    checkout, order and payment workflows plus CUSTOMER/ADMIN authorization.
servers:
  - url: http://localhost:8003
    description: Sandbox host port
  - url: http://benchmark-order:8000
    description: Internal Docker network
security: []
tags:
  - name: Health
    description: Service availability.
  - name: Products
    description: Public product catalog and stock.
  - name: Cart
    description: Customer-owned shopping cart operations.
  - name: Orders
    description: Multi-step checkout, payment and cancellation workflows.
  - name: Coupons
    description: Coupon business rules for customer carts.
  - name: Administration
    description: Endpoints restricted to the ADMIN role.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check service health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products and current stock
      responses:
        '200':
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductResponse' }
  /products/{product_id}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get one product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get the authenticated customer's cart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current cart, always including an items array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add a product to the authenticated customer's cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemCreate' }
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart/items/{item_id}:
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove an item from the authenticated customer's cart
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204': { description: Item removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /checkout:
    post:
      tags: [Orders]
      operationId: checkoutCart
      summary: Convert a non-empty owned cart into a pending order
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order created from the cart
          headers:
            Location:
              description: Relative URL of the created order
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create a pending order directly from product items
      description: Duplicate product lines are combined before available stock is validated.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Order created
          headers:
            Location:
              description: Relative URL of the created order
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{order_id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an owned order, or any order as ADMIN
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{order_id}/pay:
    post:
      tags: [Orders]
      operationId: payOrder
      summary: Pay an owned pending order exactly once
      description: Stock is validated again and deducted atomically when payment succeeds.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Paid order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{order_id}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an owned order that has not shipped
      description: Cancelling a paid order restores its deducted stock.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/orders:
    get:
      tags: [Administration]
      operationId: listAllOrders
      summary: List all customer orders as ADMIN
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /coupons/apply:
    post:
      tags: [Coupons]
      operationId: applyCoupon
      summary: Apply SAVE10 when an owned cart subtotal is at least 100
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponApplyRequest' }
      responses:
        '200':
          description: Coupon calculation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: synthetic-token
  parameters:
    ProductId:
      name: product_id
      in: path
      required: true
      description: Seeded products are 1, 2 and 3; product 2 (Wireless Mouse) has 100 in stock.
      schema: { type: integer, minimum: 1, examples: [2] }
    ItemId:
      name: item_id
      in: path
      required: true
      description: >-
        Id of a cart item, returned by POST /cart/items; the seeded carts are empty, so there is no
        seeded item id.
      schema: { type: integer, minimum: 1 }
    OrderId:
      name: order_id
      in: path
      required: true
      description: >-
        Seeded orders are 901 (PENDING, customer bob) and 902 (SHIPPED, customer alice); orders
        created through the API get new ids.
      schema: { type: integer, minimum: 1, examples: [902] }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Role or ownership check failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Business rule or state transition failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: ecommerce-order }
    ProductResponse:
      type: object
      additionalProperties: false
      required: [id, sku, name, price, stock]
      properties:
        id: { type: integer, minimum: 1 }
        sku: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 120 }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
    CartItemCreate:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, minimum: 1, examples: [2] }
        quantity: { type: integer, minimum: 1, maximum: 100, examples: [1] }
    CartItemResponse:
      type: object
      additionalProperties: false
      required: [id, product_id, product_name, quantity, unit_price, line_total]
      properties:
        id: { type: integer, minimum: 1 }
        product_id: { type: integer, minimum: 1 }
        product_name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: number, minimum: 0 }
        line_total: { type: number, minimum: 0 }
    CartResponse:
      type: object
      additionalProperties: false
      required: [id, customer_id, items, total_amount]
      properties:
        id: { type: integer, minimum: 1 }
        customer_id: { type: integer, minimum: 1 }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItemResponse' }
        total_amount: { type: number, minimum: 0 }
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [cart_id]
      properties:
        cart_id:
          type: integer
          minimum: 1
          description: Cart of the caller (customer alice owns cart 101, bob owns cart 102)
          examples: [101]
    OrderItemCreate:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, minimum: 1, examples: [2] }
        quantity: { type: integer, minimum: 1, maximum: 100, examples: [1] }
    OrderCreate:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/OrderItemCreate' }
    OrderItemResponse:
      type: object
      additionalProperties: false
      required: [product_id, product_name, quantity, unit_price, line_total]
      properties:
        product_id: { type: integer, minimum: 1 }
        product_name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: number, minimum: 0 }
        line_total: { type: number, minimum: 0 }
    OrderResponse:
      type: object
      additionalProperties: false
      required: [id, customer_id, items, subtotal, discount, total_amount, status]
      properties:
        id: { type: integer, minimum: 1 }
        customer_id: { type: integer, minimum: 1 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemResponse' }
        subtotal: { type: number, minimum: 0 }
        discount: { type: number, minimum: 0 }
        total_amount: { type: number, minimum: 0 }
        status:
          type: string
          enum: [PENDING, PAID, SHIPPED, CANCELLED]
    CouponApplyRequest:
      type: object
      additionalProperties: false
      required: [cart_id, code]
      properties:
        cart_id:
          type: integer
          minimum: 1
          description: Cart of the caller (customer alice owns cart 101, bob owns cart 102)
          examples: [101]
        code: { type: string, minLength: 1, maxLength: 32, pattern: '^[A-Z0-9_-]+$', examples: [SAVE10] }
    CouponResponse:
      type: object
      additionalProperties: false
      required: [code, subtotal, discount, total_amount]
      properties:
        code: { type: string }
        subtotal: { type: number, minimum: 0 }
        discount: { type: number, minimum: 0 }
        total_amount: { type: number, minimum: 0 }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail: { $ref: '#/components/schemas/ErrorDetail' }
    ValidationErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            additionalProperties: true
